services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: insights, POSTGRES_PASSWORD: insights, POSTGRES_DB: insights }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U insights"], interval: 5s, timeout: 3s, retries: 15 }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./migrations:/docker-entrypoint-initdb.d:ro"]
  kafka:
    image: apache/kafka:3.9.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck: { test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"], interval: 10s, timeout: 5s, retries: 15 }
  api:
    build: { context: ., args: { TARGET: api } }
    environment: &app-env
      DATABASE_URL: postgres://insights:insights@postgres:5432/insights?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on: { postgres: { condition: service_healthy }, kafka: { condition: service_healthy } }
    ports: ["8080:8080"]
  worker:
    build: { context: ., args: { TARGET: worker } }
    environment: *app-env
    depends_on: { postgres: { condition: service_healthy }, kafka: { condition: service_healthy } }
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: ["./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.5.2
    environment: { GF_SECURITY_ADMIN_PASSWORD: sandbox }
    volumes: ["./observability/grafana/provisioning:/etc/grafana/provisioning:ro", "./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro"]
    ports: ["3000:3000"]
  otel-collector:
    image: otel/opentelemetry-collector:0.120.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4318:4318"]
volumes: { pgdata: {} }
